apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp022-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp022-api
  template:
    metadata:
      labels:
        app: mp022-api
    spec:
      containers:
        - name: mp022-api
          image: mp022-api:1.0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
